# Test coverage with cargo-tarpaulin (`cargo install cargo-tarpaulin`).
#
#   cargo tarpaulin                                    # offline (this file)
#   MSSQL_TEST_CONNECTION_STRING=... \
#     cargo tarpaulin --config tarpaulin-live.toml     # + the live suite
#
# Offline covers the library's unit tests plus tests/tls_local.rs (a local
# rustls server). Every other integration test needs a SQL Server.
#
# Reports land in target/tarpaulin/ (tarpaulin-report.html, lcov.info).
# The LLVM engine works on macOS and Linux; ptrace is Linux/x86-64 only.

[default]
engine = "Llvm"
no-default-features = true
features = "rustls tds73 rust_decimal bigdecimal time jiff sql-browser-tokio sql-browser-smol serde"
workspace = false
run-types = ["Lib"]
test = ["tls_local"]
# This profile deliberately selects rustls and direct TCP. Source for the two
# mutually-exclusive TLS backends, SQL Browser transports, and SSPI tokens is
# verified in their own feature-matrix jobs and cannot execute in this build.
exclude-files = [
    "benches/*",
    "examples/*",
    "runtimes-macro/*",
    "tests/*",
    "target/*",
    "src/client/tls_stream/native_tls_stream.rs",
    "src/client/tls_stream/opentls_tls_stream.rs",
    "src/sql_browser/smol.rs",
    "src/sql_browser/tokio.rs",
    "src/tds/codec/token/token_sspi.rs",
    # Declarative macro definitions are counted separately from their expanded,
    # tested implementations by LLVM source mapping.
    "src/macros.rs",
]
out = ["Html", "Lcov"]
output-dir = "target/tarpaulin"
timeout = "600s"
target-dir = "target/tarpaulin-build"
