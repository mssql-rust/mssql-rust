# cargo-nextest configuration for the mssql crate. Opt-in and local: CI keeps using
# `cargo test`. Run `cargo nextest run` from mssql/; nextest does not run
# doctests, so also run `cargo test --doc`.

[profile.default]
# Report every failure, never stop at the first.
fail-fast = false
# Retries stay off: a retry hides a flaky test. Do not enable them here.
retries = 0
status-level = "pass"
final-status-level = "fail"
# Flag a test after 60s and kill it after 10 periods (10 minutes).
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci]
retries = 0
fail-fast = false
status-level = "fail"
final-status-level = "fail"
slow-timeout = { period = "60s", terminate-after = 10 }

# Most integration tests (tests/*.rs) need a live SQL Server through
# MSSQL_TEST_CONNECTION_STRING, and without one they fail exactly as under
# `cargo test`. cargo test runs test binaries one after another; nextest runs
# tests from different binaries at once, so the integration binaries are
# serialised on their one shared server. Unit tests (--lib) stay parallel.
[test-groups]
live-db = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'kind(test)'
test-group = "live-db"
