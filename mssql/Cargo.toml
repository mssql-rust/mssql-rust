[package]
authors = [
    "Steffen Butzer <steffen.butzer@outlook.com>",
    "Julius de Bruijn <bruijn@prisma.io>",
    "Eric Sheppard <eric@eigenmo.de>",
    "Yoshua Wuyts <yoshuawuyts@gmail.com>",
    "Joel Parker Henderson <joel@joelparkerhenderson.com>",
]
description = "MSSQL TDS driver. Fork of Tiberius, with a focus on ongoing maintenance and security updates."
documentation = "https://docs.rs/mssql/"
edition = "2021"
keywords = ["tds", "mssql", "sql"]
license = "MIT/Apache-2.0"
name = "mssql"
readme = "README.md"
repository = "https://github.com/mssql-rust/mssql-rust"
rust-version.workspace = true
version = "0.12.3"

[workspace]
members = ["runtimes-macro"]

[workspace.package]
# MSRV policy: current stable minus two minor versions. See
# spec/rust-msrv-n-minus-2/index.md for the rule and the maintenance steps to
# follow when stable Rust advances. Every workspace member inherits this
# via `rust-version.workspace = true` instead of declaring its own value.
rust-version = "1.96"

[[test]]
path = "tests/query.rs"
name = "query"

[[test]]
path = "tests/named-instance-async.rs"
name = "named-instance-async"
required-features = ["sql-browser-async-std"]

[[test]]
path = "tests/named-instance-tokio.rs"
name = "named-instance-tokio"
required-features = ["sql-browser-tokio"]

[[test]]
path = "tests/named-instance-smol.rs"
name = "named-instance-smol"
required-features = ["sql-browser-smol"]

[dependencies]
enumflags2 = "0.7"
byteorder = "1.5"
encoding_rs = "0.8"
once_cell = "1.21"
thiserror = "1.0"
bytes = "1.12"
pretty-hex = "0.3"
pin-project-lite = "0.2"
asynchronous-codec = "0.6"
async-trait = "0.1"
connection-string = "0.2"
num-traits = "0.2"
uuid = "1.26"

[target.'cfg(windows)'.dependencies]
winauth = { version = "0.0.5", optional = true }

[target.'cfg(unix)'.dependencies]
libgssapi = { version = "0.8.3", optional = true, default-features = false }

[dependencies.async-native-tls]
version = "0.4"
features = ["runtime-async-std"]
optional = true

[dependencies.tokio]
version = "1.53"
optional = true
features = ["net", "time"]

[dependencies.tokio-util]
version = "0.7"
features = ["compat"]
optional = true

[dependencies.async-std]
version = "1"
optional = true
features = ["attributes"]

[dependencies.chrono]
version = "0.4"
optional = true
default-features = false

[dependencies.time]
version = "0.3"
optional = true

[dependencies.futures-util]
version = "0.3"
default-features = false
features = ["io", "sink"]

[dependencies.tracing]
features = ["log"]
version = "0.1"

[dependencies.rust_decimal]
version = "1.42"
optional = true

[dependencies.bigdecimal_]
version = "0.3"
optional = true
package = "bigdecimal"

[dependencies.async-io]
version = "1.13"
optional = true

[dependencies.async-net]
version = "1.8"
optional = true

[dependencies.futures-lite]
version = "1.13.0"
optional = true

[dependencies.tokio-rustls]
version = "0.26"
optional = true

[dependencies.rustls-native-certs]
version = "0.8"
optional = true

[dependencies.opentls]
version = "0.2.1"
optional = true
features = ["io-async-std", "vendored"]

[dev-dependencies.uuid]
version = "1.26"
features = ["v4"]

[dev-dependencies.tokio-util]
version = "0.7"
features = ["compat"]

[dev-dependencies.tokio]
features = [
    "macros",
    "sync",
    "io-std",
    "time",
    "io-util",
    "net",
    "rt-multi-thread",
]
version = "1.53"

[dev-dependencies.async-std]
features = ["attributes"]
version = "1"

[dev-dependencies.runtimes-macro]
path = "./runtimes-macro"

[dev-dependencies]
anyhow = "1"
env_logger = "0.11"
azure_identity = "1.0.0"
url = "2.5.8"
paste = "1.0"
indicatif = "0.17"
chrono = "0.4.45"
indoc = "1.0.9"
azure_core = "1.1.0"

[package.metadata.docs.rs]
features = ["all", "docs"]

[features]
all = [
    "chrono",
    "time",
    "tds73",
    "sql-browser-async-std",
    "sql-browser-tokio",
    "sql-browser-smol",
    "integrated-auth-gssapi",
    "rust_decimal",
    "bigdecimal",
    "native-tls",
]
default = ["tds73", "winauth", "native-tls"]
tds73 = []
docs = []
sql-browser-async-std = ["async-std"]
sql-browser-tokio = ["tokio", "tokio-util"]
sql-browser-smol = ["async-io", "async-net", "futures-lite"]
integrated-auth-gssapi = ["libgssapi"]
bigdecimal = ["bigdecimal_"]
rustls = ["tokio-rustls", "tokio-util", "rustls-native-certs"]
native-tls = ["async-native-tls"]
vendored-openssl = ["opentls"]
