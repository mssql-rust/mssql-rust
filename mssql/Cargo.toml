[package]
authors = [
    "Steffen Butzer <steffen.butzer@outlook.com>",
    "Julius de Bruijn <bruijn@prisma.io>",
    "Eric Sheppard <eric@eigenmo.de>",
    "Yoshua Wuyts <yoshuawuyts@gmail.com>",
    "Joel Parker Henderson <joel@joelparkerhenderson.com>",
]
description = "MSSQL TDS driver. Fork of Tiberius, with a focus on ongoing maintenance and security updates."
documentation = "https://docs.rs/mssql/"
edition = "2021"
keywords = ["tds", "mssql", "sql"]
license = "MIT/Apache-2.0"
name = "mssql"
readme = "README.md"
repository = "https://github.com/mssql-rust/mssql-rust"
rust-version.workspace = true
version = "1.0.1"

[workspace]
members = ["runtimes-macro"]

[workspace.package]
# MSRV policy: current stable minus two minor versions. See
# spec/rust-msrv-n-minus-2/index.md for the rule and the maintenance steps to
# follow when stable Rust advances. Every workspace member inherits this
# via `rust-version.workspace = true` instead of declaring its own value.
rust-version = "1.96"

[[test]]
path = "tests/query.rs"
name = "query"

[[test]]
path = "tests/named-instance-async.rs"
name = "named-instance-async"
required-features = ["sql-browser-async-std"]

[[test]]
path = "tests/named-instance-tokio.rs"
name = "named-instance-tokio"
required-features = ["sql-browser-tokio"]

[[test]]
path = "tests/named-instance-smol.rs"
name = "named-instance-smol"
required-features = ["sql-browser-smol"]

[[test]]
path = "tests/serde.rs"
name = "serde"
required-features = ["serde"]

# `Config::trust_webpki_roots` only exists with this feature enabled, so the
# example itself must be skipped (not merely fail to run) for every other
# build, including the MSRV job's `cargo check --all-targets` under default
# features.
[[example]]
name = "webpki_roots"
required-features = ["rustls-webpki-roots"]

# `Column`, `ColumnData`, and `TokenRow` only implement `Serialize`/
# `Deserialize` with this feature enabled, so the example itself must be
# skipped (not merely fail to run) for every other build, including the MSRV
# job's `cargo check --all-targets` under default features.
[[example]]
name = "serde_json"
required-features = ["serde"]

[dependencies]
enumflags2 = "0.7"
byteorder = "1.5"
encoding_rs = "0.8"
once_cell = "1.21"
thiserror = "1.0"
bytes = "1.12"
pretty-hex = "0.3"
pin-project-lite = "0.2"
asynchronous-codec = "0.6"
async-trait = "0.1"
connection-string = "0.2"
num-traits = "0.2"
uuid = "1.26"
zeroize = "1.8.2"
cfg-if = "1.0"
webpki-roots = { version = "1.0.9", optional = true }
serde = { version = "1.0", optional = true, features = ["derive", "rc"] }

[target.'cfg(windows)'.dependencies]
winauth = { version = "0.0.5", optional = true }

[target.'cfg(unix)'.dependencies]
libgssapi = { version = "0.8.3", optional = true, default-features = false }
sspi = { version = "0.21.3", optional = true }

[dependencies.async-native-tls]
version = "0.4"
features = ["runtime-async-std"]
optional = true

[dependencies.tokio]
version = "1.53"
optional = true
features = ["net", "time"]

[dependencies.tokio-util]
version = "0.7"
features = ["compat"]
optional = true

[dependencies.async-std]
version = "1"
optional = true
features = ["attributes"]

[dependencies.chrono]
version = "0.4"
optional = true
default-features = false

[dependencies.time]
version = "0.3"
optional = true

[dependencies.futures-util]
version = "0.3"
default-features = false
features = ["io", "sink"]

[dependencies.tracing]
features = ["log"]
version = "0.1"

[dependencies.rust_decimal]
version = "1.42"
optional = true

[dependencies.bigdecimal_]
version = "0.3"
optional = true
package = "bigdecimal"

[dependencies.async-io]
version = "2"
optional = true

[dependencies.async-net]
version = "2"
optional = true

[dependencies.futures-lite]
version = "2"
optional = true

[dependencies.tokio-rustls]
version = "0.26"
optional = true

[dependencies.rustls-native-certs]
version = "0.8"
optional = true

[dependencies.opentls]
version = "0.2.1"
optional = true
features = ["io-async-std", "vendored"]

[dev-dependencies.uuid]
version = "1.26"
features = ["v4"]

[dev-dependencies.tokio-util]
version = "0.7"
features = ["compat"]

[dev-dependencies.tokio]
features = [
    "macros",
    "sync",
    "io-std",
    "time",
    "io-util",
    "net",
    "rt-multi-thread",
]
version = "1.53"

[dev-dependencies.async-std]
features = ["attributes"]
version = "1"

[dev-dependencies.runtimes-macro]
path = "./runtimes-macro"

[dev-dependencies]
anyhow = "1"
env_logger = "0.11"
azure_identity = "1.0.0"
url = "2.5.8"
indicatif = "0.18"
chrono = "0.4.45"
indoc = "1.0.9"
azure_core = "1.1.0"
pastey = "0.2"
smol = "2.0.2"
serde_json = "1.0"

[package.metadata.docs.rs]
features = ["all", "docs"]

[features]
all = [
    "chrono",
    "time",
    "tds73",
    "sql-browser-async-std",
    "sql-browser-tokio",
    "sql-browser-smol",
    "integrated-auth-gssapi",
    "sspi-rs",
    "rust_decimal",
    "bigdecimal",
    "native-tls",
    "serde",
]
default = ["tds73", "winauth", "native-tls"]
tds73 = []
docs = []
sql-browser-async-std = ["async-std"]
sql-browser-tokio = ["tokio", "tokio-util"]
sql-browser-smol = ["async-io", "async-net", "futures-lite"]
integrated-auth-gssapi = ["libgssapi"]
bigdecimal = ["bigdecimal_"]
rustls = ["tokio-rustls", "tokio-util", "rustls-native-certs"]
native-tls = ["async-native-tls"]
vendored-openssl = ["opentls"]
# Pure-Rust NTLM (via the `sspi` crate) for Windows/Integrated auth on Unix,
# without needing a real Kerberos ticket cache (unlike
# `integrated-auth-gssapi`). Named `sspi-rs` (matching upstream's naming
# convention for this feature) rather than the implicit `sspi` feature
# `dep:sspi` would otherwise generate, to avoid the feature name reading as
# if it gated the whole SSPI/Windows-auth concept rather than just this one
# backend for it.
sspi-rs = ["dep:sspi"]
# Validate the server's TLS certificate against Mozilla's curated root CA
# list (via the `webpki-roots` crate, bundled at compile time) instead of
# the operating system's own certificate store. Useful in minimal/scratch
# containers that don't ship a system trust store. Implies `rustls`, since
# this is a trust-source option for that backend specifically.
rustls-webpki-roots = ["dep:webpki-roots", "rustls"]
# Optional serde Serialize/Deserialize impls for query result types (Row,
# Column, ColumnType, ColumnData, TokenRow, Numeric, and the time/xml
# types), so results can be shipped over the network as JSON.
serde = ["dep:serde", "uuid/serde"]
