version: 2
updates:
  # Rust dependencies (Cargo.toml at the mssql/ workspace root covers the
  # runtimes-macro member too).
  - package-ecosystem: "cargo"
    directory: "/mssql"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "rust"

  # Pinned SHAs in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
