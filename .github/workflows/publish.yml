name: Publish to crates.io

# Manual only, deliberately: publishing is a one-way door (crates.io
# versions are immutable — see mssql-rust-maintainer-skill's
# release-checklist.md), so this never fires from a tag push or a
# GitHub Release. A maintainer runs it by hand from the Actions tab,
# after confirming Unreleased is ready and the full verification
# matrix (including the live-database legs test.yml runs, which this
# workflow does not repeat) is green for the commit being published.
on:
  workflow_dispatch:

jobs:
  # A fast, non-live-database safety net — not a replacement for
  # test.yml's full matrix, which the operator is expected to have
  # already checked green for this commit before dispatching this
  # workflow.
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mssql
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: "mssql -> target"
      - name: Install dependencies
        run: sudo apt install -y openssl libkrb5-dev
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test --lib
      - name: Rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --features=all -- -D warnings
      - name: Dry-run package
        run: cargo publish --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mssql
    # Required for crates-io-auth-action to mint a short-lived crates.io
    # token via OIDC — no CARGO_REGISTRY_TOKEN secret needed or stored.
    permissions:
      id-token: write
      contents: read
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v1
        with:
          toolchain: stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
      - name: Publish
        run: cargo publish --token ${{ steps.auth.outputs.token }}
