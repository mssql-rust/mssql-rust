name: Cargo tests
on:
  push:
    branches:
      - main
    paths:
      - "mssql/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "mssql/**"
      - ".github/workflows/test.yml"

# This workflow lived at mssql/.github/workflows/ (its own repo root)
# before mssql/ became a subdirectory of a larger monorepo; GitHub Actions
# only reads .github/workflows/ at the true repo root, so every `run:`
# step below needs mssql/ as its working directory now that this file
# does too.
defaults:
  run:
    working-directory: mssql

jobs:
  # Advisories, licenses, bans and sources, per mssql/deny.toml (found next
  # to the manifest). Ported from upstream Tiberius f823a1b. Pinned to
  # cargo-deny-action v2.1.1 (cargo-deny 0.20.2, the version this config was
  # verified with).
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          manifest-path: ./mssql/Cargo.toml

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: "mssql -> target"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y openssl libkrb5-dev
      - name: Clippy
        run: cargo clippy --features=all -- -D warnings

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Rustfmt
        run: cargo fmt --check

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: "mssql -> target"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y openssl libkrb5-dev
      # Verifies the rust-version declared in Cargo.toml (see
      # spec/rust-msrv-n-minus-2/index.md): the code must compile on this pinned
      # toolchain, not just claim to. A red msrv job means a change started
      # requiring a newer compiler than the policy allows.
      - name: Check MSRV
        run: cargo check --all-targets --workspace

  cargo-test-linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database:
          - 2017
          - 2019
          - 2022
          - azure-sql-edge
        features:
          - "--features=all"
          - "--no-default-features"
          - "--no-default-features --features=jiff"
          - "--no-default-features --features=time"
          - "--no-default-features --features=rustls"
          - "--no-default-features --features=rustls-webpki-roots"
          - "--no-default-features --features=vendored-openssl"

    env:
      MSSQL_TEST_CONNECTION_STRING: "server=tcp:localhost,1433;user=SA;password=<YourStrong@Passw0rd>;TrustServerCertificate=true"
      RUSTFLAGS: "-Dwarnings"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable

      - name: Compute cache key
        shell: bash
        run: |
          key="${{ matrix.features }}"
          key="${key//,/+}"
          echo "RUST_CACHE_KEY=$key" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
          workspaces: "mssql -> target"

      - name: Start SQL Server ${{matrix.database}}
        run: DOCKER_BUILDKIT=1 docker compose -f docker-compose.yml up -d mssql-${{matrix.database}}

      # A started container is not a ready server: SQL Server binds 1433
      # before it finishes recovering its databases, so tests started at once
      # race it and hit sporadic login failures. Wait for its own "ready"
      # log line, as the macOS job and docker/test-server.sh already do.
      # Idea from upstream Tiberius 169091d, which gates on a sqlcmd SELECT 1
      # from the legacy mssql-tools image instead.
      # Captures the logs and matches with `case` rather than piping into
      # `grep -q`: under `pipefail` (which `shell: bash` turns on), `grep -q`
      # exiting on the first match makes the writer die of SIGPIPE and the
      # pipeline report failure. This is the same trap the macOS job and
      # docker/test-server.sh document.
      - name: Wait for SQL Server ${{matrix.database}}
        run: |
          for _ in $(seq 1 90); do
            logs="$(docker compose -f docker-compose.yml logs mssql-${{matrix.database}} 2>&1 || true)"
            case "$logs" in
              *"SQL Server is now ready for client connections"*)
                echo "SQL Server ready"; exit 0
                ;;
            esac
            sleep 2
          done
          echo "SQL Server did not become ready in time; logs:" >&2
          docker compose -f docker-compose.yml logs mssql-${{matrix.database}} || true
          exit 1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y openssl libkrb5-dev

      - name: Run tests
        run: cargo test ${{matrix.features}}

  # Coverage of the unit tests plus the whole live suite, against SQL Server
  # 2022 (mssql/tarpaulin-live.toml has the feature set). Line and function
  # coverage must both remain strictly above 95%.
  coverage:
    runs-on: ubuntu-latest
    env:
      MSSQL_TEST_CONNECTION_STRING: "server=tcp:localhost,1433;user=SA;password=<YourStrong@Passw0rd>;TrustServerCertificate=true"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: coverage
          workspaces: "mssql -> target"

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: cargo-tarpaulin

      - name: Start SQL Server 2022
        run: DOCKER_BUILDKIT=1 docker compose -f docker-compose.yml up -d mssql-2022

      # Same capture-and-match wait as cargo-test-linux (see the comment there).
      - name: Wait for SQL Server 2022
        run: |
          for _ in $(seq 1 90); do
            logs="$(docker compose -f docker-compose.yml logs mssql-2022 2>&1 || true)"
            case "$logs" in
              *"SQL Server is now ready for client connections"*)
                echo "SQL Server ready"; exit 0
                ;;
            esac
            sleep 2
          done
          echo "SQL Server did not become ready in time; logs:" >&2
          docker compose -f docker-compose.yml logs mssql-2022 || true
          exit 1

      # The feature-matrix trace in tarpaulin-live.toml enables `all`, which
      # includes integrated-auth-gssapi and therefore needs the system headers.
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y openssl libkrb5-dev

      - name: Run coverage
        # pipefail: the default `bash -e` would let `tee` hide a failing run.
        run: |
          set -o pipefail
          cargo tarpaulin --config tarpaulin-live.toml 2>&1 | tee tarpaulin.log
          coverage="$(sh scripts/check-coverage.sh target/tarpaulin-live/lcov.info)"
          echo "### Coverage (SQL Server 2022, live suite)" >> "$GITHUB_STEP_SUMMARY"
          echo "$coverage" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: |
            mssql/target/tarpaulin-live/tarpaulin-report.html
            mssql/target/tarpaulin-live/lcov.info
          if-no-files-found: warn

  cargo-test-windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        database:
          - 2019
        features:
          - "--features=all"
          - "--no-default-features --features=rustls,winauth"
          - "--no-default-features --features=vendored-openssl,winauth"

    env:
      MSSQL_TEST_INSTANCE: "MSSQLSERVER"
      MSSQL_TEST_CONNECTION_STRING: "server=tcp:127.0.0.1,1433;IntegratedSecurity=true;TrustServerCertificate=true"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable

      - name: Compute cache key
        shell: bash
        run: |
          key="${{ matrix.features }}"
          key="${key//,/+}"
          echo "RUST_CACHE_KEY=$key" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
          workspaces: "mssql -> target"

      - name: Set required PowerShell modules
        id: psmodulecache
        uses: potatoqualitee/psmodulecache@ee5e9494714abf56f6efbfa51527b2aec5c761b8  # v6.2.1
        with:
          modules-to-cache: SqlServer

      - name: Setup Chocolatey download cache
        id: chococache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: C:\Users\runneradmin\AppData\Local\Temp\chocolatey\
          key: chocolatey-install

      - name: Install required PowerShell modules
        shell: powershell
        run: |
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module SqlServer

      - name: Install SQL Server ${{matrix.database}}
        shell: powershell
        run: |
          choco feature disable --name="'exitOnRebootDetected'"
          $ErrorActionPreference = 'SilentlyContinue'
          choco install sql-server-${{matrix.database}} --params="'/IgnorePendingReboot'"

      - name: Setup SQL Server ${{matrix.database}}
        shell: powershell
        run: |
          Import-Module 'sqlps'

          [reflection.assembly]::LoadWithPartialName("Microsoft.SqlServer.Smo") | Out-Null
          [reflection.assembly]::LoadWithPartialName("Microsoft.SqlServer.SqlWmiManagement") | Out-Null

          $serverName = $env:COMPUTERNAME
          $instanceName = "MSSQLSERVER"

          $smo = 'Microsoft.SqlServer.Management.Smo.'
          $wmi = new-object ($smo + 'Wmi.ManagedComputer')
          $wmi

          # Enable TCP/IP
          echo "Enabling TCP/IP"
          $Tcp = $wmi.GetSmoObject("ManagedComputer[@Name='$serverName']/ServerInstance[@Name='$instanceName']/ServerProtocol[@Name='Tcp']")
          $Tcp.IsEnabled = $true
          $Tcp.alter()
          $Tcp

          # Enable named pipes
          echo "Enabling named pipes"
          $Np = $wmi.GetSmoObject("ManagedComputer[@Name='$serverName']/ServerInstance[@Name='$instanceName']/ServerProtocol[@Name='Np']")
          $Np.IsEnabled = $true
          $Np.Alter()
          $Np

          # Set Alias
          echo "Setting the alias"
          New-Item HKLM:\SOFTWARE\Microsoft\MSSQLServer\Client -Name ConnectTo | Out-Null
          Set-ItemProperty -Path HKLM:\SOFTWARE\Microsoft\MSSQLServer\Client\ConnectTo -Name '(local)' -Value "DBMSSOCN,$serverName\$instanceName" | Out-Null

          # Mixed-mode authentication. The tests still connect with
          # IntegratedSecurity, but tests/special_char_password.rs creates SQL
          # logins and signs in as them. A Windows-only server refuses those
          # with error 18452 ("login is from an untrusted domain"). Takes
          # effect on the restart below and is checked after it. (An SMO
          # `$srv.Alter()` doesn't save `Settings.LoginMode`, and PowerShell
          # doesn't fail the step on that, so use sqlcmd with -b.)
          echo "Enabling mixed-mode authentication"
          sqlcmd -S . -E -b -Q "EXEC xp_instance_regwrite N'HKEY_LOCAL_MACHINE', N'Software\Microsoft\MSSQLServer\MSSQLServer', N'LoginMode', REG_DWORD, 2"
          if ($LASTEXITCODE -ne 0) { throw "could not set LoginMode" }

          # Start services
          echo "Starting services"
          Set-Service SQLBrowser -StartupType Manual
          Start-Service SQLBrowser
          net stop MSSQLSERVER
          net start MSSQLSERVER

          # Fail here, not in the tests, if mixed mode didn't take.
          # Capture sqlcmd's output before filtering it: piping it straight
          # into `Select-Object -First 1` stops sqlcmd early, which leaves a
          # nonzero $LASTEXITCODE, and the runner exits the step with that.
          $mode = ""
          foreach ($i in 1..30) {
            $out = sqlcmd -S . -E -b -h -1 -W -Q "SET NOCOUNT ON; SELECT SERVERPROPERTY('IsIntegratedSecurityOnly')" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $mode = @($out | Where-Object { "$_".Trim() }) | Select-Object -First 1
              if ($mode) { break }
            }
            Start-Sleep -Seconds 2
          }
          echo "IsIntegratedSecurityOnly = $mode"
          if ("$mode".Trim() -ne "0") { throw "SQL Server is not in mixed-mode authentication" }
          exit 0

      - name: Run normal tests
        shell: powershell
        run: cargo test ${{matrix.features}}

  cargo-test-macos:
    runs-on: macos-26-intel

    strategy:
      fail-fast: false
      matrix:
        database:
          - 2019
        features:
          - "--no-default-features --features=rustls,jiff,time,tds73,sql-browser-tokio,sql-browser-smol,integrated-auth-gssapi,rust_decimal,bigdecimal"
          - "--no-default-features --features=vendored-openssl"

    env:
      MSSQL_TEST_CONNECTION_STRING: "server=tcp:localhost,1433;user=SA;password=<YourStrong@Passw0rd>;TrustServerCertificate=true"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable

      - name: Compute cache key
        shell: bash
        run: |
          key="${{ matrix.features }}"
          key="${key//,/+}"
          echo "RUST_CACHE_KEY=$key" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: ${{ env.RUST_CACHE_KEY }}
          workspaces: "mssql -> target"

      # setup-docker-action boots a Lima VM, and that first downloads an
      # Ubuntu cloud image. On these runners the download intermittently
      # fails on DNS ("lookup cloud-images.ubuntu.com: i/o timeout", run
      # 44092502525), a transient network failure rather than a setup
      # problem. Try once more before failing the job. The failed attempt
      # leaves a stopped Lima instance behind, so remove it first.
      - name: Set up Docker
        id: setup-docker
        continue-on-error: true
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6  # v5.7.0

      - name: Clean up the failed Docker VM before retrying
        if: steps.setup-docker.outcome == 'failure'
        run: |
          limactl delete --force docker-actions-toolkit || true
          sleep 30

      - name: Set up Docker (retry)
        if: steps.setup-docker.outcome == 'failure'
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6  # v5.7.0

      - name: Install docker compose plugin
        run: brew install docker-compose

      - name: Start SQL Server ${{matrix.database}}
        # The Lima/Docker VM on this runner intermittently fails an image
        # pull with "failed to validate image signature" (a content-trust
        # resolver hiccup, not a real signature problem — retrying usually
        # succeeds). This surfaces *after* `docker compose up -d` already
        # reported success — the failed layer pull happens lazily, so the
        # container comes up but SQL Server itself never starts, and the
        # tests immediately after got a connection reset rather than a
        # docker-level error. Retrying the `up` command alone (the first
        # attempt at this fix) wasn't enough for exactly that reason —
        # confirmed live: "Start SQL Server" passed but every test then
        # failed with `Io { kind: UnexpectedEof }`.
        #
        # So wait for the server to actually report ready, the same way
        # docker/test-server.sh does for local runs (log-polled, not
        # `grep -q`, to dodge that script's own documented SIGPIPE/
        # pipefail trap); retry the whole up/down cycle if it never does.
        run: |
          for attempt in 1 2 3; do
            DOCKER_BUILDKIT=1 docker compose -f docker-compose.yml up -d mssql-${{matrix.database}} || true

            ready=0
            for _ in $(seq 1 60); do
              logs="$(docker compose -f docker-compose.yml logs mssql-${{matrix.database}} 2>&1 || true)"
              case "$logs" in
                *"SQL Server is now ready for client connections"*)
                  ready=1
                  break
                  ;;
              esac
              sleep 2
            done

            if [ "$ready" = 1 ]; then
              exit 0
            fi

            echo "SQL Server not ready (attempt $attempt/3); cleaning up and retrying..."
            docker compose -f docker-compose.yml down -v || true
            sleep 10
          done
          echo "SQL Server never became ready after 3 attempts; last logs:"
          docker compose -f docker-compose.yml logs mssql-${{matrix.database}} | tail -30
          exit 1

      - name: Run tests
        run: cargo test ${{matrix.features}}
